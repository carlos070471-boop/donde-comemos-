name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Crear aplicación web
        run: npm run build

      - name: Configurar entorno Android
        uses: android-actions/setup-android@v3

      - name: Crear proyecto Android con Capacitor
        run: npx cap add android

      - name: Compilar APK de depuración
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: donde-comemos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
