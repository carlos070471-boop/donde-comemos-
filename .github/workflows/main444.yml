name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "prueba-banner-admob" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Crear aplicación web
        run: npm run build

      - name: Crear proyecto Android con Capacitor
        run: npx cap add android

      - name: Añadir permisos de ubicación y App ID AdMob de prueba
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar aplicación y plugins Android
        run: npx cap sync android

      - name: Compilar APK de depuración
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: donde-comemos-banner-prueba-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
