name: Probar búsqueda real de restaurantes
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probar servidores OpenStreetMap con restaurantes reales
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          query='[out:json][timeout:20];nwr(around:2500,41.654,2.226)[amenity~"^(restaurant|cafe|fast_food|bar)$"];out center tags;'
          hosts=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter']
          errors=[]
          for host in hosts:
              try:
                  url=host+'?'+urllib.parse.urlencode({'data':query})
                  req=urllib.request.Request(url,headers={'User-Agent':'DondeComemosSmokeTest/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=35) as response:
                      data=json.load(response)
                  places=[e for e in data.get('elements',[]) if e.get('tags',{}).get('name')]
                  print(host,'restaurantes con nombre:',len(places))
                  if len(places)>0:
                      print('Ejemplos:',[e['tags']['name'] for e in places[:5]])
                      break
                  errors.append(host+': respuesta vacía')
              except Exception as exc:
                  errors.append(host+': '+str(exc))
          else:
              raise SystemExit('ERROR: Ningún servidor devuelve restaurantes. '+str(errors))
          PY
